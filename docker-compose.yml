services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: thekabook
      POSTGRES_PASSWORD: local_dev_only
      POSTGRES_DB: thekabook
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - thekabook_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U thekabook"]
      interval: 5s
      retries: 10
volumes:
  thekabook_pg:
